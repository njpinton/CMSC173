<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CMSC 173</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1B5E4F 0%, #2D4F47 50%, #7A1E3F 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #D4AF37;
        }

        h1 {
            color: #1B5E4F;
            font-size: 2.5em;
            font-weight: 700;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }

        .btn-primary {
            background-color: #1B5E4F;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0F3E35;
        }

        .btn-secondary {
            background-color: #7A1E3F;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #5C162F;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background-color: #c82333;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1B5E4F 0%, #7A1E3F 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-value {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #D4AF37;
        }

        .stat-label {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .section-title {
            color: #7A1E3F;
            font-size: 1.8em;
            margin: 40px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #D4AF37;
        }

        .groups-container {
            display: grid;
            gap: 25px;
        }

        .group-card {
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .group-card:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border-color: #D4AF37;
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }

        .group-info h3 {
            color: #1B5E4F;
            font-size: 1.6em;
            margin-bottom: 10px;
        }

        .group-meta {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .group-actions {
            display: flex;
            gap: 10px;
        }

        .group-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-top: 20px;
        }

        .members-section, .documents-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .section-header {
            font-size: 1.2em;
            color: #1B5E4F;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .members-list, .documents-list {
            list-style: none;
        }

        .members-list li {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
        }

        .members-list li:last-child {
            border-bottom: none;
        }

        .member-icon {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #1B5E4F, #7A1E3F);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 12px;
        }

        .documents-list li {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .documents-list li:last-child {
            border-bottom: none;
        }

        .doc-link {
            color: #1B5E4F;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .doc-link:hover {
            color: #7A1E3F;
            text-decoration: underline;
        }

        .doc-meta {
            font-size: 0.85em;
            color: #888;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #888;
            font-style: italic;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #D4AF37;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: #B8941F;
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .group-content {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Admin Dashboard</h1>
            <div class="nav-buttons">
                <a href="/group_portal" class="btn btn-primary">Group Portal</a>
                <a href="/" class="btn btn-secondary">Modules</a>
                <a href="/admin_logout" class="btn btn-danger">Logout</a>
            </div>
        </div>

        <!-- Statistics Section -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-value" id="totalGroups">-</div>
                <div class="stat-label">Total Groups</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalMembers">-</div>
                <div class="stat-label">Total Students</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalDocuments">-</div>
                <div class="stat-label">Total Submissions</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgDocsPerGroup">-</div>
                <div class="stat-label">Avg Docs/Group</div>
            </div>
        </div>

        <!-- Groups Section -->
        <h2 class="section-title">All Groups & Submissions</h2>
        <div id="groupsContainer" class="groups-container">
            <div class="loading">Loading groups...</div>
        </div>

        <!-- Refresh Button -->
        <button class="refresh-btn" onclick="loadDashboardData()" title="Refresh Data">↻</button>
    </div>

    <script>
        // Load dashboard data on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboardData();
        });

        async function loadDashboardData() {
            try {
                const response = await fetch('/api/groups');
                const groups = await response.json();

                if (groups.error) {
                    showError(groups.error);
                    return;
                }

                // Update statistics
                updateStatistics(groups);

                // Load detailed information for each group
                await loadGroupDetails(groups);

            } catch (error) {
                console.error('Error loading dashboard data:', error);
                showError('Failed to load dashboard data: ' + error.message);
            }
        }

        function updateStatistics(groups) {
            document.getElementById('totalGroups').textContent = groups.length;

            // We'll update these after loading group details
            document.getElementById('totalMembers').textContent = '-';
            document.getElementById('totalDocuments').textContent = '-';
            document.getElementById('avgDocsPerGroup').textContent = '-';
        }

        async function loadGroupDetails(groups) {
            const container = document.getElementById('groupsContainer');

            if (groups.length === 0) {
                container.innerHTML = '<div class="empty-state">No groups have been created yet.</div>';
                return;
            }

            container.innerHTML = '';
            let totalMembers = 0;
            let totalDocuments = 0;

            for (const group of groups) {
                try {
                    const response = await fetch(`/api/groups/${group.id}`);
                    const details = await response.json();

                    if (details.error) {
                        console.error('Error loading group details:', details.error);
                        continue;
                    }

                    totalMembers += details.members?.length || 0;
                    totalDocuments += details.documents?.length || 0;

                    const groupCard = createGroupCard(details);
                    container.appendChild(groupCard);

                } catch (error) {
                    console.error('Error loading group:', error);
                }
            }

            // Update statistics with actual data
            document.getElementById('totalMembers').textContent = totalMembers;
            document.getElementById('totalDocuments').textContent = totalDocuments;
            const avgDocs = groups.length > 0 ? (totalDocuments / groups.length).toFixed(1) : 0;
            document.getElementById('avgDocsPerGroup').textContent = avgDocs;
        }

        function createGroupCard(group) {
            const card = document.createElement('div');
            card.className = 'group-card';

            const createdDate = new Date(group.created_at).toLocaleString();
            const memberCount = group.members?.length || 0;
            const docCount = group.documents?.length || 0;

            card.innerHTML = `
                <div class="group-header">
                    <div class="group-info">
                        <h3>${escapeHtml(group.group_name)}</h3>
                        <div class="group-meta">
                            <strong>Project:</strong> ${escapeHtml(group.project_title || 'Not specified')}
                        </div>
                        <div class="group-meta">
                            <strong>Created:</strong> ${createdDate}
                        </div>
                        <div style="margin-top: 10px;">
                            <span class="badge badge-success">${memberCount} member${memberCount !== 1 ? 's' : ''}</span>
                            <span class="badge badge-info">${docCount} document${docCount !== 1 ? 's' : ''}</span>
                        </div>
                    </div>
                    <div class="group-actions">
                        <button class="btn btn-danger btn-sm" onclick="deleteGroup('${group.id}', '${escapeHtml(group.group_name)}')">
                            Delete
                        </button>
                    </div>
                </div>

                <div class="group-content">
                    <div class="members-section">
                        <div class="section-header">👥 Members</div>
                        ${createMembersList(group.members)}
                    </div>
                    <div class="documents-section">
                        <div class="section-header">📄 Submissions</div>
                        ${createDocumentsList(group.documents)}
                    </div>
                </div>
            `;

            return card;
        }

        function createMembersList(members) {
            if (!members || members.length === 0) {
                return '<div class="empty-state">No members yet</div>';
            }

            const memberItems = members.map(member => {
                const initial = member.member_name.charAt(0).toUpperCase();
                return `
                    <li>
                        <div class="member-icon">${initial}</div>
                        ${escapeHtml(member.member_name)}
                    </li>
                `;
            }).join('');

            return `<ul class="members-list">${memberItems}</ul>`;
        }

        function createDocumentsList(documents) {
            if (!documents || documents.length === 0) {
                return '<div class="empty-state">No submissions yet</div>';
            }

            const docItems = documents.map(doc => {
                const uploadedDate = new Date(doc.created_at).toLocaleString();
                const filename = doc.file_path.split('/').pop();
                return `
                    <li>
                        <div>
                            <a href="/uploads/${filename}" target="_blank" class="doc-link">
                                📎 ${escapeHtml(doc.document_title)}
                            </a>
                            <div class="doc-meta">Uploaded: ${uploadedDate}</div>
                        </div>
                    </li>
                `;
            }).join('');

            return `<ul class="documents-list">${docItems}</ul>`;
        }

        async function deleteGroup(groupId, groupName) {
            if (!confirm(`Are you sure you want to delete "${groupName}" and all associated data?\n\nThis action cannot be undone.`)) {
                return;
            }

            try {
                const response = await fetch(`/api/groups/${groupId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Group deleted successfully!');
                    loadDashboardData(); // Reload dashboard
                } else {
                    alert('Error deleting group: ' + result.error);
                }
            } catch (error) {
                alert('Failed to delete group: ' + error.message);
            }
        }

        function showError(message) {
            const container = document.getElementById('groupsContainer');
            container.innerHTML = `<div class="error">❌ ${escapeHtml(message)}</div>`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
